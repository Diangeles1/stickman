      HTML ESTATICO, sem ferramenta de build de desenvolvimento.

      O bundle e gerado por scripts/arena-tempo-real.mjs com o esbuild que ja

    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #05070b;
        color: #c8d2e4;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        overflow: hidden;
      }
      /* o canvas do Three nasce inline e deixaria uma faixa de alguns pixels */
      canvas {
        display: block;
      }
      #semJs {
        padding: 24px;
        line-height: 1.6;
      }
    </style>
  </head>
